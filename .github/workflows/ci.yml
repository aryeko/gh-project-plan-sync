name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  POETRY_VERSION: "2.4.1"

jobs:
  commitlint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          fetch-depth: 0
      - uses: opensource-nepal/commitlint@b475c5486b51a090474c55a8dd2eafc84bcd84ba # v1

  actionlint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - name: Install actionlint
        run: |
          set -euo pipefail
          version="1.7.12"
          arch="$(uname -m)"
          checksum=""
          case "$arch" in
            x86_64)
              artifact="actionlint_${version}_linux_amd64.tar.gz"
              checksum="8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
              ;;
            aarch64|arm64)
              artifact="actionlint_${version}_linux_arm64.tar.gz"
              checksum="325e971b6ba9bfa504672e29be93c24981eeb1c07576d730e9f7c8805afff0c6"
              ;;
            *) echo "Unsupported architecture: $arch" >&2; exit 1 ;;
          esac
          curl -fsSL -o "$artifact" "https://github.com/rhysd/actionlint/releases/download/v${version}/${artifact}"
          printf "%s  %s\n" "$checksum" "$artifact" | sha256sum -c -
          tar -xzf "$artifact" actionlint
          sudo install -m 0755 actionlint /usr/local/bin/actionlint
      - name: Lint workflows
        run: actionlint

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - run: pipx install "poetry==${POETRY_VERSION}"
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.12"
          cache: "poetry"
      - name: Install dependencies
        run: poetry install --no-interaction
      - name: Ruff check
        run: poetry run ruff check .
      - name: Ruff format check
        run: poetry run ruff format --check .
      - name: Docs link check
        run: poetry run poe docs-links
      - name: Type check
        run: poetry run poe typecheck

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - run: pipx install "poetry==${POETRY_VERSION}"
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: "poetry"
      - name: Install dependencies
        run: poetry install --no-interaction
      - name: Run tests (excluding E2E)
        run: |
          if [ "${{ matrix.python-version }}" = "3.11" ]; then
            poetry run pytest -v --ignore=tests/e2e --cov-fail-under=90
          else
            poetry run pytest -v --ignore=tests/e2e --no-cov
          fi
      - name: Upload coverage
        if: matrix.python-version == '3.11'
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7
        with:
          files: .coverage/coverage.xml
          flags: unittests
          fail_ci_if_error: false
      - name: Verify CLI
        run: poetry run planpilot --help

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - run: pipx install "poetry==${POETRY_VERSION}"
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.11"
          cache: "poetry"
      - name: Install dependencies
        run: poetry install --no-interaction
      - name: Run E2E tests
        run: poetry run poe test-e2e

  package:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - run: pipx install "poetry==${POETRY_VERSION}"
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.12"
          cache: "poetry"
      - name: Install dependencies
        run: poetry install --no-interaction
      - name: Build package
        run: poetry build
      - name: Validate package metadata
        run: |
          python -m pip install --upgrade twine==6.2.0
          twine check dist/*
      - name: Upload dist artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/*
          if-no-files-found: error
