name: Release

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

# Least privilege by default; elevated per-job.
permissions:
  contents: read

# Prevent overlapping releases if two merges land in quick succession.
concurrency:
  group: release-main
  cancel-in-progress: false

env:
  POETRY_VERSION: "2.4.1"

jobs:
  # ── Job 1: Semantic Release — bump, changelog, tag ─────────────
  release:
    name: Semantic Release + Build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # Gate: CI passed, on main, not a PSR release commit (defense-in-depth).
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      !startsWith(github.event.workflow_run.head_commit.message, 'chore(release):')

    permissions:
      contents: write

    outputs:
      released: ${{ steps.psr.outputs.released }}
      tag:      ${{ steps.psr.outputs.tag }}
      version:  ${{ steps.psr.outputs.version }}

    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - name: Checkout main at CI-tested commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ github.event.workflow_run.head_branch }}
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Verify we are on the CI-tested commit
        env:
          EXPECTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          actual=$(git rev-parse HEAD)
          if [ "$actual" != "$EXPECTED_SHA" ]; then
            echo "HEAD mismatch: expected $EXPECTED_SHA, got $actual"
            exit 1
          fi

      - run: pipx install "poetry==${POETRY_VERSION}"
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.12"
          cache: "poetry"

      - name: Install dependencies
        run: poetry install --no-interaction

      - name: Python Semantic Release
        id: psr
        uses: python-semantic-release/python-semantic-release@39dd2052f2ce8282a5d932c31d58a2ca06d2550e # v10.6.1
        with:
          github_token: ${{ steps.app-token.outputs.token }}
          vcs_release: "true"
          changelog: "true"
          build: "false"

      - name: Verify plugin and runtime release surfaces
        if: steps.psr.outputs.released == 'true'
        run: |
          poetry run python scripts/check_release_surfaces.py --fix
          git diff --exit-code

      - name: Build package
        if: steps.psr.outputs.released == 'true'
        run: poetry build

      - name: Upload dist artifacts
        if: steps.psr.outputs.released == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/*
          if-no-files-found: error

  # ── Job 2: Publish to TestPyPI + smoke test ────────────────────
  publish-testpypi:
    name: TestPyPI + Smoke Test
    needs: release
    if: needs.release.outputs.released == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: testpypi
    permissions:
      id-token: write      # OIDC + PEP 740 attestations

    steps:
      - name: Checkout (for smoke-test script)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          sparse-checkout: scripts
          sparse-checkout-cone-mode: true

      - name: Download dist
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@ba38be9e461d3875417946c167d0b5f3d385a247 # v1.14.1
        with:
          repository-url: https://test.pypi.org/legacy/
          attestations: true

      - name: Smoke test — install and verify from TestPyPI
        env:
          PKG_VERSION: ${{ needs.release.outputs.version }}
        run: ./scripts/smoke-test.sh

  # ── Job 3: Publish to PyPI ─────────────────────────────────────
  publish-pypi:
    name: Publish to PyPI
    needs: [release, publish-testpypi]
    if: needs.release.outputs.released == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: pypi
    permissions:
      id-token: write      # OIDC + PEP 740 attestations

    steps:
      - name: Download dist
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@ba38be9e461d3875417946c167d0b5f3d385a247 # v1.14.1
        with:
          attestations: true

  # ── Job 4: GitHub Release ──────────────────────────────────────
  github-release:
    name: GitHub Release
    needs: [release, publish-pypi]
    if: needs.release.outputs.released == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0

      - name: Download dist
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/

      - name: Create GitHub Release + upload assets
        uses: python-semantic-release/publish-action@5a5718ce47b892ef699f2972dae122297771d641 # v10.6.1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ needs.release.outputs.tag }}
